name: Test and reproduce numerical artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerical-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Reproduce experiments
        run: python run_experiments.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numerical-artifacts-${{ github.sha }}
          path: |
            figures/
            results/
          if-no-files-found: error
          retention-days: 14
